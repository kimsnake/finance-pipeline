name: Hourly Financial Data Pipeline
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync

    - name: Run Financial Data Script
      run: uv run finance_main.py

    - name: Push data to Archive Repo
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        # 한국 시간대 설정 (TZ 환경변수 설정)
        export TZ='Asia/Seoul'
        
        MONTH_STR=$(date +%Y%m)
        
        # 1. 아카이브 저장소 클론
        git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/kimsnake/financial-data-archive.git
        
        # 2. 이번 달 데이터가 있는지 확인하고, 있다면 이어 붙이기
        # (이 부분은 동일)
        for file in data/finance/${MONTH_STR}_*.csv; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            if [ -f "financial-data-archive/$filename" ]; then
              tail -n +2 "$file" >> "financial-data-archive/$filename"
            else
              cp "$file" "financial-data-archive/$filename"
            fi
          fi
        done
        
        # 3. 데이터 저장소로 이동 및 푸시
        cd financial-data-archive
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 변경 사항이 있을 때만 푸시
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Update hourly data: ${MONTH_STR} $(date +'%Y-%m-%d %H:%M')"
          git push
        else
          echo "변경 사항이 없어 푸시를 생략합니다."
        fi