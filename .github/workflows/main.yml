name: Hourly Data Pipeline
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.11

    - name: Install dependencies
      run: uv sync

    - name: Run Data Collection Scripts
      run: |
        uv run finance_main.py || echo "Finance script failed, continuing..."
        uv run trends_main.py || echo "Trends script failed, continuing..."

    - name: Push data to Archive Repo
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        export TZ='Asia/Seoul'
        MONTH_STR=$(date +%Y%m)
        
        # 1. 아카이브 저장소 클론
        git clone --depth 1 https://x-access-token:${GH_PAT}@github.com/kimsnake/financial-data-archive.git
        
        # 2. 파일 처리 함수 (중복 로직 방지 및 안정성 강화)
        process_files() {
            local target_dir=$1
            # 폴더가 실제로 존재하는지 확인
            if [ -d "$target_dir" ]; then
                find "$target_dir" -name "${MONTH_STR}_*.csv" | while read file; do
                    dest="financial-data-archive/$file"
                    dest_dir=$(dirname "$dest")
                    
                    # 💡 여기가 핵심: 복사 전에 무조건 폴더 생성
                    mkdir -p "$dest_dir"
                    
                    if [ -f "$dest" ]; then
                        # 이미 파일이 있으면 헤더 빼고 이어쓰기
                        tail -n +2 "$file" >> "$dest"
                    else
                        # 파일이 없으면 그냥 복사
                        cp "$file" "$dest"
                    fi
                done
            fi
        }

        # data 폴더와 trends 폴더 각각 처리
        process_files "data"
        process_files "trends"
        
        # 3. 데이터 저장소로 이동 및 푸시
        cd financial-data-archive
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 변경 사항이 있을 때만 푸시
        if [ -n "$(git status --porcelain)" ]; then
          git add .
          git commit -m "Update hourly data: ${MONTH_STR} $(date +'%Y-%m-%d %H:%M')"
          git push
        else
          echo "변경 사항이 없어 푸시를 생략합니다."
        fi